<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light"><title>The Shluchim of Santa Teresa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--navy:#0E1E3F;--gold:#E0A345;--gold-d:#B07A1E;--cream:#FAF6EF;--card:#FFFDF9;--line:#E6DFCF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--cream);color:var(--navy);font:400 17px/1.55 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;margin:0;line-height:1.15}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.top{background:var(--navy);color:var(--cream);text-align:center;padding:56px 20px 120px}
.eyebrow{color:var(--gold);letter-spacing:.22em;font-size:14px;font-weight:500;text-transform:uppercase;margin-bottom:16px}
.top h1{font-size:clamp(34px,8vw,52px);max-width:640px;margin:0 auto}
.herocard{max-width:680px;margin:-80px auto 0;background:var(--card);border-radius:28px;padding:14px 14px 22px;box-shadow:0 14px 36px rgba(14,30,63,.14);text-align:center}
.herocard img,.ph{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:20px;display:block;background:#E3DBC9}
.herocard p{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:26px;margin:18px 8px 0}
section{padding:64px 0 0}
section>h2{text-align:center;font-size:clamp(28px,6vw,38px);margin-bottom:28px}
.col{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:12px}
.ic{flex:none;width:52px;height:52px;border-radius:50%;background:#F1E8D6;display:grid;place-items:center;overflow:hidden}
.ic svg{width:28px;height:28px}.ic img{width:32px;height:32px;object-fit:contain}
.col p{margin:0;font-size:18px}
.goal{background:var(--navy);color:var(--cream);margin-top:64px;padding:64px 0}
.goal h2{text-align:center;font-size:clamp(30px,7vw,46px);margin-bottom:28px}
.bar{height:22px;border-radius:11px;background:#2E3D5C;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#D4923A,#EBBC5C);border-radius:11px}
.nums{display:flex;justify-content:space-between;margin-top:12px;font-size:18px}
.nums b{color:var(--gold);font-weight:600}
.pay{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px;margin-bottom:16px;box-shadow:0 8px 24px rgba(14,30,63,.07)}
.pay h3{font-size:26px}
.pay .sub{color:#4B5670;margin:6px 0 18px}
.num{font:600 22px Figtree,sans-serif;background:#F6F0E2;border-radius:14px;padding:14px 16px;margin-bottom:12px;word-break:break-all}
.btn{display:block;width:100%;border:0;border-radius:999px;background:var(--gold);color:var(--navy);font:600 18px Figtree,sans-serif;text-align:center;text-decoration:none;padding:17px;cursor:pointer}
.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #3B6FD8;outline-offset:2px}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.gal img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:24px;display:block}
footer{padding:64px 0 40px;text-align:center;color:#7A7364;font-size:14px}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .8s ease}}
</style></head><body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n)||0);
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const ICONS={"candle": "<rect x=\"9\" y=\"11\" width=\"6\" height=\"9\" rx=\"1\"/><path d=\"M7 20h10M12 9.5V11\"/><path d=\"M12 3c1.6 1.8 2.2 3 2.2 4.2a2.2 2.2 0 0 1-4.4 0C9.8 6 10.4 4.8 12 3z\" stroke=\"#E0A345\" fill=\"#E0A345\"/>", "menorah": "<path d=\"M12 8v12M8 20h8M5 8v3a5 5 0 0 0 5 5h4a5 5 0 0 0 5-5V8M8.5 9v5M15.5 9v5\"/><circle cx=\"5\" cy=\"6\" r=\"1\" stroke=\"#E0A345\" fill=\"#E0A345\"/><circle cx=\"8.5\" cy=\"7\" r=\"1\" stroke=\"#E0A345\" fill=\"#E0A345\"/><circle cx=\"12\" cy=\"6\" r=\"1\" stroke=\"#E0A345\" fill=\"#E0A345\"/><circle cx=\"15.5\" cy=\"7\" r=\"1\" stroke=\"#E0A345\" fill=\"#E0A345\"/><circle cx=\"19\" cy=\"6\" r=\"1\" stroke=\"#E0A345\" fill=\"#E0A345\"/>", "torah": "<rect x=\"7\" y=\"5.5\" width=\"10\" height=\"13\" rx=\"1\"/><path d=\"M3.5 4h3M3.5 20h3M17.5 4h3M17.5 20h3M5 4v16M19 4v16\"/><path d=\"M9.5 10h5M9.5 13h5\" stroke=\"#E0A345\"/>", "book": "<path d=\"M12 6.5C10.5 5 8 4.5 4 4.5v13c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-13c-4 0-6.5.5-8 2zM12 6.5v13\"/><path d=\"M6.5 9h2.5M6.5 12h2.5\" stroke=\"#E0A345\"/>", "star": "<path d=\"M12 3.5l7 12.2H5zM12 20.5L5 8.3h14z\"/><circle cx=\"12\" cy=\"12\" r=\"1.3\" stroke=\"#E0A345\" fill=\"#E0A345\"/>", "cup": "<path d=\"M7 4h10v5a5 5 0 0 1-10 0zM12 14v5M8.5 20h7\"/><path d=\"M7.3 8h9.4\" stroke=\"#E0A345\"/>", "community": "<circle cx=\"12\" cy=\"8\" r=\"2.6\"/><path d=\"M7.5 20v-1.5a4.5 4.5 0 0 1 9 0V20\"/><circle cx=\"5\" cy=\"10.5\" r=\"2\"/><circle cx=\"19\" cy=\"10.5\" r=\"2\"/><path d=\"M1.5 19v-.8a3.4 3.4 0 0 1 3.4-3.4M22.5 19v-.8a3.4 3.4 0 0 0-3.4-3.4\"/><path d=\"M12 4V3\" stroke=\"#E0A345\"/>", "teens": "<circle cx=\"8\" cy=\"10\" r=\"2.6\"/><circle cx=\"16\" cy=\"10\" r=\"2.6\"/><path d=\"M3.5 20v-1.2a4.5 4.5 0 0 1 9 0V20M11.5 20v-1.2a4.5 4.5 0 0 1 9 0V20\"/><path d=\"M12 2.5v3M10.5 4h3\" stroke=\"#E0A345\"/>", "heart": "<path d=\"M12 20s-7-4.4-7-9.6A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.4C19 15.6 12 20 12 20z\"/><path d=\"M8.5 11.2A1.8 1.8 0 0 1 10.3 9.6\" stroke=\"#E0A345\"/>", "box": "<rect x=\"5\" y=\"9\" width=\"14\" height=\"11\" rx=\"2\"/><path d=\"M9 9V7.5h6V9M10 14.5h4\"/><circle cx=\"12\" cy=\"4.5\" r=\"2\" stroke=\"#E0A345\" fill=\"#E0A345\"/>", "house": "<path d=\"M4 11l8-6.5L20 11M6 9.5V20h12V9.5M10 20v-5.5h4V20\"/><circle cx=\"12\" cy=\"8.8\" r=\"1\" stroke=\"#E0A345\" fill=\"#E0A345\"/>", "calendar": "<rect x=\"4\" y=\"5.5\" width=\"16\" height=\"14.5\" rx=\"2\"/><path d=\"M4 10h16M8.5 3.5v4M15.5 3.5v4\"/><circle cx=\"12\" cy=\"15\" r=\"1.5\" stroke=\"#E0A345\" fill=\"#E0A345\"/>"};
const icon=c=>c.img?`<img src="${esc(c.img)}" alt="">`:`<svg viewBox="0 0 24 24" fill="none" stroke="#0E1E3F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[c.i]||ICONS.star}</svg>`;
let S;
function page(s){
const pct=s.goal>0?Math.min(100,Math.round(s.raised/s.goal*100)):0,u=safeUrl(s.cash.url);
return `<header class="top"><div class="eyebrow">${esc(s.eyebrow)}</div><h1>${esc(s.title)}</h1></header>
<div class="wrap"><div class="herocard">${s.heroImg?`<img src="${esc(s.heroImg)}" alt="">`:'<div class="ph"></div>'}<p>${esc(s.heroCaption)}</p></div>
<section><h2>${esc(s.colsTitle)}</h2>${(s.cols||[]).map(c=>`<div class="col"><span class="ic">${icon(c)}</span><p>${esc(c.t)}</p></div>`).join('')}</section></div>
<div class="goal"><div class="wrap"><h2>${esc(s.goalPrefix)} ${money(s.goal)}</h2><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><div class="nums"><span><b>${money(s.raised)}</b> ${esc(s.raisedLabel)}</span><span>${pct}% of ${money(s.goal)}</span></div></div></div>
<div class="wrap"><section style="padding-top:56px"><h2>${esc(s.payTitle)}</h2>
<div class="pay"><h3>${esc(s.zelle.title)}</h3><p class="sub">${esc(s.zelle.sub)}</p><div class="num">${esc(s.zelle.num)}</div><button class="btn" data-copy>${esc(s.zelle.copy)}</button></div>
<div class="pay"><h3>${esc(s.cash.title)}</h3><p class="sub">${esc(s.cash.sub)}</p><a class="btn" ${u?`href="${esc(u)}" target="_blank" rel="noopener"`:'href="#" aria-disabled="true"'}>${esc(s.cash.btn)}</a></div></section>
${(s.gal||[]).length?`<section><h2>${esc(s.galTitle)}</h2><div class="gal">${s.gal.map(g=>`<img src="${esc(g)}" alt="" loading="lazy">`).join('')}</div></section>`:''}
<footer>${esc(s.footer)}</footer></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b||!S)return;const t=S.zelle.num,o=b.textContent,ok=()=>{b.textContent=S.zelle.copied;setTimeout(()=>b.textContent=o,1800)};
const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(x){}a.remove()};
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb()});
fetch('/content/site.json',{cache:'no-store'}).then(r=>r.json()).then(s=>{S=s;document.title=s.title;$('#root').innerHTML=page(s)}).catch(()=>{$('#root').innerHTML='<p style="padding:40px;text-align:center">Content could not be loaded. Open this page from your Netlify link, not as a local file.</p>'});
</script>
</body></html>
